name: Spike Load Tests

on:
  workflow_dispatch: 

jobs:
  Spike:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Build & launch api
        run: |
          cd server/Startup
          dotnet build
          dotnet run --urls http://0.0.0.0:5000 &
          
          for i in {1..20}; do
            if curl -sSf http://localhost:5000/; then
              echo "API is up!"
              break
            else
              sleep 1
            fi
          done
      
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common curl
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          
      - name: Run spike_test.js
        run: |
          k6 run \
          -e LOGIN_EMAIL=${{ secrets.LOGIN_EMAIL }} \
          -e LOGIN_PASSWORD=${{ secrets.LOGIN_PASSWORD }} \
          server/Startup.Tests/load-tests/spike_test.js
          
          
  Windows-powershell-run:
    name: Run PowerShell helper on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build & launch api
        run: |
          cd server/Startup
          dotnet build
          dotnet run --urls http://0.0.0.0:5000 &

          for i in {1..20}; do
            if curl -sSf http://localhost:5000/; then
              echo "API is up!"
              break
            else
              sleep 1
            fi
          done
        
      - name: Install k6 via Chocolatey
        run: choco install k6 -y
        
      - name: Run run_spike_test.ps1
        shell: pwsh
        run: |
          .\run_spike_test.ps1 `
            -Email "${{ secrets.LOGIN_EMAIL }}" `
            -Password "${{ secrets.LOGIN_PASSWORD }}"